<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>登录 | 文档管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f4f6;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .login-card {
            width: min(380px, 100%);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        h1 { font-size: 18px; font-weight: 650; margin-bottom: 6px; }
        .hint { color: #6b7280; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin: 12px 0 6px; }
        input {
            width: 100%;
            min-height: 40px;
            padding: 9px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #9ca3af; box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.12); }
        button {
            width: 100%;
            min-height: 40px;
            margin-top: 18px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #4b5563;
            color: white;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }
        button:disabled { opacity: 0.65; cursor: default; }
        .status { margin-top: 12px; min-height: 20px; color: #6b7280; font-size: 13px; line-height: 1.45; }
        .status.error { color: #991b1b; }
        .status.success { color: #166534; }
    </style>
</head>
<body>
    <form class="login-card" id="loginForm" autocomplete="on">
        <!-- h1>文档管理登录</h1 -->
        <!-- p class="hint">登录成功后会把用户名和密码保存到 localStorage。下次打开会自动尝试登录，失败会自动清除登录信息。</p -->
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginBtn" type="submit">登录</button>
        <div class="status" id="status">就绪</div>
    </form>

    <script>
        const AUTH_STORE_USER = 'novelAuthUsername';
        const AUTH_STORE_PASS = 'novelAuthPassword';
        const LEGACY_AUTH_COOKIE_USER = 'novelAuthUsername';
        const LEGACY_AUTH_COOKIE_PASS = 'novelAuthPassword';

        function clearLegacyAuthCookies() {
            document.cookie = `${encodeURIComponent(LEGACY_AUTH_COOKIE_USER)}=; Max-Age=0; Path=/; SameSite=Lax`;
            document.cookie = `${encodeURIComponent(LEGACY_AUTH_COOKIE_PASS)}=; Max-Age=0; Path=/; SameSite=Lax`;
        }

        function saveAuthCredentials(username, password) {
            localStorage.setItem(AUTH_STORE_USER, username);
            localStorage.setItem(AUTH_STORE_PASS, password);
            clearLegacyAuthCookies();
        }

        function clearAuthCredentials() {
            localStorage.removeItem(AUTH_STORE_USER);
            localStorage.removeItem(AUTH_STORE_PASS);
            clearLegacyAuthCookies();
        }

        function fnv1a64Hex(value) {
            let hash = 0xcbf29ce484222325n;
            const prime = 0x100000001b3n;
            const mask = 0xffffffffffffffffn;
            const bytes = new TextEncoder().encode(value);
            for (const b of bytes) {
                hash ^= BigInt(b);
                hash = (hash * prime) & mask;
            }
            return hash.toString(16).padStart(16, '0');
        }

        function makeAuthFingerprint(username, password, timestamp) {
            return fnv1a64Hex(`${username}\n${password}\n${timestamp}`);
        }

        function authUrl(url, username, password) {
            const timestamp = String(Date.now());
            const sep = url.includes('?') ? '&' : '?';
            return `${url}${sep}timestamp=${encodeURIComponent(timestamp)}&fingerprint=${encodeURIComponent(makeAuthFingerprint(username, password, timestamp))}`;
        }

        function setStatus(message, type = '') {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = 'status ' + type;
        }

        async function testLogin(username, password, auto = false) {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            setStatus(auto ? '正在自动登录...' : '正在登录...');
            try {
                const timestamp = String(Date.now());
                const response = await fetch('/index.html', {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'X-Auth-Timestamp': timestamp,
                        'X-Auth-Fingerprint': makeAuthFingerprint(username, password, timestamp)
                    }
                });
                if (!response.ok) throw new Error('用户名或密码错误');
                saveAuthCredentials(username, password);
                setStatus('登录成功，正在进入...', 'success');
                window.location.href = authUrl('/index.html', username, password);
            } catch (e) {
                clearAuthCredentials();
                setStatus(auto ? '自动登录失败，请手动登录' : (e.message || '登录失败'), 'error');
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                setStatus('请输入用户名和密码', 'error');
                return;
            }
            testLogin(username, password, false);
        });

        clearLegacyAuthCookies();
        const savedUser = localStorage.getItem(AUTH_STORE_USER);
        const savedPass = localStorage.getItem(AUTH_STORE_PASS);
        if (savedUser && savedPass) {
            document.getElementById('username').value = savedUser;
            document.getElementById('password').value = savedPass;
            // 浏览器关闭后仍会保留登录信息；清除浏览器数据或登录失败会移除。
            testLogin(savedUser, savedPass, true);
        }
    </script>
</body>
</html>
